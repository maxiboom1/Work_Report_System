<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work Reports - Login</title>
  <link rel="stylesheet" href="/assets/login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-panel">
      <img class="company-logo" src="/assets/company-logo.jpg" alt="I/O Systems" />

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label class="label" for="username">Username</label>
          <input id="username" class="input" type="text" autocomplete="username" required />
        </div>

        <div class="field">
          <label class="label" for="password">Password</label>
          <input id="password" class="input" type="password" autocomplete="current-password" required />
        </div>

        <div class="actions">
          <button id="btn-login" class="btn primary" type="submit">Login</button>
        </div>
      </form>

      <div id="status" class="status"></div>
    </section>
  </main>

  <script src="/assets/login.js"></script>
</body>
</html>
